<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./img/favicon.png" type="image/png" />
    <title>將捷旅境 | 探索文山新景點、愛麗絲夢遊仙境</title>

    <!--
      第三方套件一律以 CDN 引入；
      若電腦沒有網路（純單機使用），onerror 會自動改用 vendor/ 內的本機備援檔案。
    -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      onerror="this.onerror=null;this.href='./vendor/bootstrap.min.css';"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.6.0/css/all.min.css"
      onerror="this.onerror=null;this.href='./vendor/fontawesome/css/all.min.css';"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/sweetalert2@11.12.4/dist/sweetalert2.min.css"
      onerror="this.onerror=null;this.href='./vendor/sweetalert2.min.css';"
    />

    <!-- 本專案自己的樣式，放最後才能覆寫上面的套件樣式 -->
    <link rel="stylesheet" href="./assets/app.css" />
  </head>
  <body>
    <div id="app"></div>

    <script src="https://cdn.jsdelivr.net/npm/vue@3.4.38/dist/vue.global.prod.js"></script>
    <script>
      window.Vue || document.write('<script src="./vendor/vue.global.prod.js"><\/script>');
    </script>

    <script src="https://cdn.jsdelivr.net/npm/vue-router@4.4.3/dist/vue-router.global.prod.js"></script>
    <script>
      window.VueRouter || document.write('<script src="./vendor/vue-router.global.prod.js"><\/script>');
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      window.bootstrap || document.write('<script src="./vendor/bootstrap.bundle.min.js"><\/script>');
    </script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.12.4/dist/sweetalert2.min.js"></script>
    <script>
      window.Sweetalert2 || document.write('<script src="./vendor/sweetalert2.min.js"><\/script>');
    </script>

    <script src="./assets/app.js"></script>
  </body>
</html>
